<h2 mat-dialog-title>@if (data.isEdit) {
  Renomer
} @else {
  Nouveau playlist
}</h2>
<mat-dialog-content>
  <form (ngSubmit)="submit()" [formGroup]="form">
    <mat-form-field class="example-form-field">
      <mat-label>Nom du playlist</mat-label>
      <input formControlName="name" matInput type="text"/>
      <button
        (click)="resetValues()"
        aria-label="Clear"
        matIconButton
        matSuffix
        type="button"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-dialog-actions>
      <button mat-button mat-dialog-close type="button">Annuler</button>
      <button [disabled]="!form.valid" mat-flat-button type="submit">
        @if (data.isEdit) {
          Modifier
        } @else {
          Créer
        }
      </button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
